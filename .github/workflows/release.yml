name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          TAG="${{ github.ref_name }}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          BIN="deepseek-mcp"
          if [ "$GOOS" = "windows" ]; then BIN="${BIN}.exe"; fi

          go build -trimpath \
            -ldflags "-s -w \
              -X main.version=${TAG} \
              -X main.commit=${COMMIT} \
              -X main.buildTime=${BUILD_TIME}" \
            -o "${BIN}" ./cmd/deepseek-mcp

      - name: assemble tarball
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          STAGING="staging-${GOOS}-${GOARCH}"
          mkdir -p "${STAGING}"

          if [ "$GOOS" = "windows" ]; then
            cp deepseek-mcp.exe "${STAGING}/"
          else
            cp deepseek-mcp "${STAGING}/"
            chmod +x "${STAGING}/deepseek-mcp"
          fi

          # docs, если есть — не падаем, если файла нет
          [ -f README.md ] && cp README.md "${STAGING}/" || true
          [ -f LICENSE ]   && cp LICENSE   "${STAGING}/" || true

          (cd "${STAGING}" && sha256sum * > checksums.sha256)

          TARNAME="deepseek-mcp_${TAG}_${GOOS}_${GOARCH}.tar.gz"
          tar -czf "${TARNAME}" -C "${STAGING}" .
          sha256sum "${TARNAME}" > "${TARNAME}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            deepseek-mcp_*.tar.gz
            deepseek-mcp_*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна вся история тегов для changelog

      # Забираем все 6 артефактов одной командой.
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: generate changelog
        id: changelog
        run: |
          CURRENT="${{ github.ref_name }}"

          PREV=$(git tag --sort=-version:refname \
                   | grep -v "^${CURRENT}$" \
                   | head -1)

          if [ -z "$PREV" ]; then
            RANGE="$CURRENT"
            HEADER="_First release — all commits:_"
          else
            RANGE="${PREV}..${CURRENT}"
            HEADER="_Changes since ${PREV}:_"
          fi

          LOG=$(git log "$RANGE" --pretty=format:"%h %s" --no-merges)
          KNOWN_PREFIXES="feat fix perf refactor ci docs chore"

          make_section() {
            local prefix="$1" title="$2"
            local lines
            lines=$(echo "$LOG" | grep -i "^[a-f0-9]\+ ${prefix}" || true)
            if [ -n "$lines" ]; then
              printf '\n**%s**\n' "$title"
              echo "$lines" | while IFS= read -r line; do
                sha=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | cut -d' ' -f2-)
                printf -- '- [`%s`](https://github.com/${{ github.repository }}/commit/%s) %s\n' \
                  "$sha" "$sha" "$msg"
              done
            fi
          }

          make_other_section() {
            local pattern
            pattern=$(echo "$KNOWN_PREFIXES" | tr ' ' '|')
            local lines
            lines=$(echo "$LOG" | grep -iv "^[a-f0-9]\+ \($pattern\)" || true)
            if [ -n "$lines" ]; then
              printf '\n**%s**\n' '📦 Other'
              echo "$lines" | while IFS= read -r line; do
                sha=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | cut -d' ' -f2-)
                printf -- '- [`%s`](https://github.com/${{ github.repository }}/commit/%s) %s\n' \
                  "$sha" "$sha" "$msg"
              done
            fi
          }

          {
            echo "$HEADER"
            make_section 'feat'     '🚀 Features'
            make_section 'fix'      '🐛 Bug fixes'
            make_section 'perf'     '⚡ Performance'
            make_section 'refactor' '♻️  Refactor'
            make_section 'ci'       '👷 CI / build'
            make_section 'docs'     '📝 Docs'
            make_section 'chore'    '🔧 Chore'
            make_other_section
          } > changelog.md

          echo "path=changelog.md" >> "$GITHUB_OUTPUT"

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.changelog.outputs.path }}
